<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satır Arası</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light" data-font="lora">

  <!-- Minimalist Üst Menü -->
  <header class="topbar">
    <div class="brand-group">
      <div class="brand" id="brandHome">Satır Arası</div>
      <div class="greeting-line" id="greetingLine"></div>
    </div>
    <nav class="nav-links">
      <button class="nav-btn" id="weeklyBtn" title="Haftanın Sorusu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Haftanın Sorusu
      </button>
      <button class="nav-btn" id="archiveBtn" title="Arşiv ve Arama">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Arşiv
      </button>
      <button class="nav-btn" id="popularBtn" title="En Çok Beğenilenler">
        <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Popüler
      </button>
      <button class="nav-btn" id="reportsBtn" style="display:none;" title="Bildirilen İçerikler">
        <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        <span id="reportsCount">0</span>
      </button>
      <span class="nav-divider"></span>
      <button class="nav-btn" id="appearanceBtn" title="Tema ve Yazı Tipi">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
      </button>
      <button class="nav-btn" id="soundBtn" title="Kâğıt Sesi"></button>
      <button class="profile-trigger" id="profileBtn">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="profileBtnLabel">Profil</span>
      </button>
    </nav>
  </header>

  <!-- Ana İçerik -->
  <div class="main-wrap">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-cat="Tümü">Tümü</button>
      <button class="filter-btn" data-cat="Kurucu">✦ N.A.</button>
      <button class="filter-btn" data-cat="Kitap">Kitap</button>
      <button class="filter-btn" data-cat="Film">Film</button>
      <button class="filter-btn" data-cat="Şarkı">Şarkı</button>
      <button class="filter-btn" data-cat="İlham">İlham</button>
      <button class="filter-btn" data-cat="Senin Sözün">Senin Sözün</button>
    </div>

    <div class="dedication-banner" id="dedicationBanner"></div>

    <main class="card">
      <div class="card-top-row">
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="subtle-icon-btn" id="saveToColBtn" title="Koleksiyona Kaydet">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="subtle-icon-btn" id="reportCardBtn" title="Uygunsuz içeriği bildir">
            <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          </button>
        </div>
        <div class="admin-bar" id="adminBar">
          <button class="admin-btn" id="adminFeaturedBtn">✦ N.A.</button>
          <button class="admin-btn" id="adminEditBtn">Düzenle</button>
          <button class="admin-btn danger" id="adminDeleteBtn">Sil</button>
        </div>
      </div>

      <div class="badges">
        <span class="category" id="category">Satır Arası</span>
        <span class="sub-badge" id="dailyBadge">Günün Satırı</span>
        <span class="sub-badge na-badge" id="featuredBadge">✦ N.A.</span>
      </div>

      <div class="quote-wrapper" id="quoteWrapper">
        <p class="quote-text" id="quoteText">Yükleniyor...</p>
        <p class="quote-author" id="quoteAuthor" title="Bu kaynağın diğer satırlarını gör"></p>
        <a class="listen-link" id="listenLink" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Şarkıyı Dinle
        </a>
      </div>

      <!-- Tepkiler ve Yorum -->
      <div class="reactions-wrap">
        <button class="react-btn" id="likeBtn" title="Favorilere ekle">
          <span id="heartIcon">♡</span> <span id="likeCount">0</span>
        </button>
        <div id="dynamicReactions" style="display:contents;"></div>
        <button class="react-btn" id="addEmojiBtn" title="Emoji tepkisi bırak">+</button>
        <button class="react-btn" id="toggleCommentsBtn" title="Yorumları aç/kapat">
          <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="commentCount">0</span>
        </button>

        <div class="emoji-popover" id="emojiPopover">
          <div class="emoji-quick">
            <button type="button" class="emoji-opt" data-emoji="💭">💭</button>
            <button type="button" class="emoji-opt" data-emoji="✨">✨</button>
            <button type="button" class="emoji-opt" data-emoji="🥀">🥀</button>
            <button type="button" class="emoji-opt" data-emoji="🌙">🌙</button>
            <button type="button" class="emoji-opt" data-emoji="🤍">🤍</button>
            <button type="button" class="emoji-opt" data-emoji="🍂">🍂</button>
          </div>
          <div class="emoji-custom-row">
            <input type="text" id="customEmojiInput" placeholder="İstediğin emoji..." maxlength="4">
            <button type="button" class="btn-primary" id="customEmojiSubmit" style="padding:5px 10px;font-size:0.78rem;">Ekle</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-secondary" id="prevQuoteBtn" title="Önceki Karta Dön" disabled>←</button>
        <button class="btn-primary" id="newQuoteBtn">Yeni Kart Çek</button>
        <button class="btn-secondary" id="shareBtn">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Paylaş
        </button>
        <button class="btn-secondary" id="giftBtn">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          İthaf Et
        </button>
        <button class="btn-secondary" id="copyBtn">Kopyala</button>
        <button class="btn-secondary" id="openModalBtn">+ Ekle</button>
      </div>
    </main>

    <!-- Kart Altı Yorum Bölümü -->
    <section class="comments-drawer" id="commentsDrawer">
      <div class="comments-header">
        <span>Satır Altı Yorumlar</span>
        <button class="text-link-btn" id="closeCommentsBtn">Kapat</button>
      </div>
      <div id="commentsList"></div>
      <div class="replying-bar" id="replyingBar">
        <span id="replyingText"></span>
        <button type="button" class="text-link-btn" id="cancelReplyBtn">İptal</button>
      </div>
      <form id="commentForm" class="comment-form-row">
        <input type="text" id="commentTextInput" placeholder="Bu satır sana ne hissettirdi?" required>
        <button type="submit" class="btn-primary" id="commentSubmitBtn" style="padding:9px 14px;">Gönder</button>
      </form>
    </section>
  </div>

  <footer>
    <span id="footerCounter">Satır Arası</span>
    <span id="streakCounter"></span>
  </footer>

  <!-- Alıntı Ekle / Düzenle Modalı -->
  <div class="modal-overlay" id="addModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="formModalTitle">Yeni Satır Ekle</h2>
        <button class="close-x" data-close="addModalOverlay">&times;</button>
      </div>
      <form id="quoteForm">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label for="inputCategory">Kategori</label>
          <select id="inputCategory">
            <option value="Kitap">Kitap</option>
            <option value="Film">Film</option>
            <option value="Şarkı">Şarkı</option>
            <option value="İlham">İlham</option>
            <option value="Senin Sözün">Senin Sözün (Kendi cümleni yaz)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputText">Alıntı veya Kendi Sözün</label>
          <textarea id="inputText" rows="3" placeholder="Aklında kalan o cümleyi yaz..." required></textarea>
        </div>
        <div class="form-group">
          <label for="inputAuthor">Kaynak / Yazar / Sanatçı</label>
          <input type="text" id="inputAuthor" placeholder="Boş bırakılırsa takma adın veya Anonim yazılır">
        </div>
        <div class="form-group" id="linkFormGroup">
          <label for="inputLink">Spotify / YouTube Linki (İsteğe bağlı)</label>
          <input type="url" id="inputLink" placeholder="https://open.spotify.com/...">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close="addModalOverlay">İptal</button>
          <button type="submit" class="btn-primary" id="submitBtn">Ekle</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Kişisel Profil Modalı (Takma Ad + Rozetler + Beğendiklerim + Eklediklerim + Koleksiyonlar) -->
  <div class="modal-overlay" id="profileModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Profilim</h2>
        <button class="close-x" data-close="profileModalOverlay">&times;</button>
      </div>

      <div class="form-group">
        <label for="nicknameInput">Takma Adın</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="nicknameInput" placeholder="Örn: geceokuru">
          <button type="button" class="btn-primary" id="saveNicknameBtn" style="padding:8px 14px;">Kaydet</button>
        </div>
      </div>

      <div id="profileAuthArea" style="margin-bottom:14px;"></div>

      <div class="form-group">
        <label>Okur Rozetlerin</label>
        <div class="badges-grid" id="badgesGrid"></div>
      </div>

      <div class="tab-row">
        <button type="button" class="tab-btn active" id="tabFavs">Beğendiklerim (<span id="profileFavCount">0</span>)</button>
        <button type="button" class="tab-btn" id="tabMine">Eklediklerim (<span id="profileMineCount">0</span>)</button>
        <button type="button" class="tab-btn" id="tabCols">Koleksiyonlar (<span id="profileColCount">0</span>)</button>
      </div>
      <div id="profileListContent"></div>
    </div>
  </div>

  <!-- Koleksiyona Kaydet Modalı -->
  <div class="modal-overlay" id="collectionModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Koleksiyona Kaydet</h2>
        <button class="close-x" data-close="collectionModalOverlay">&times;</button>
      </div>
      <div id="colSelectList" style="margin-bottom:14px;"></div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="newColNameInput" placeholder="Yeni koleksiyon adı (Örn: Gece Okumaları)" style="flex:1;padding:9px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--input-bg);color:var(--text-main);">
        <button type="button" class="btn-primary" id="createColBtn">Oluştur</button>
      </div>
    </div>
  </div>

  <!-- Haftanın Sorusu Modalı -->
  <div class="modal-overlay" id="weeklyModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Haftanın Sorusu</h2>
        <button class="close-x" data-close="weeklyModalOverlay">&times;</button>
      </div>
      <div class="weekly-q-box" id="weeklyQuestionText">Yükleniyor...</div>

      <!-- Sadece Yöneticiye Görünen Soru Değiştirme Alanı -->
      <div id="adminWeeklyEdit" style="display:none;margin-bottom:14px;">
        <div style="display:flex;gap:8px;">
          <input type="text" id="weeklyQuestionInput" placeholder="Yeni haftanın sorusunu yaz..." style="flex:1;padding:8px 11px;border:1px solid var(--border-color);border-radius:10px;background:var(--input-bg);color:var(--text-main);font-size:0.85rem;">
          <button type="button" class="btn-primary" id="saveWeeklyQBtn" style="padding:8px 12px;font-size:0.8rem;">Güncelle</button>
        </div>
      </div>

      <form id="weeklyAnswerForm" class="comment-form-row" style="margin-bottom:16px;">
        <input type="text" id="weeklyAnswerInput" placeholder="Tek satırlık cevabını bırak..." required>
        <button type="submit" class="btn-primary" style="padding:9px 14px;">Gönder</button>
      </form>
      <div id="weeklyAnswersList"></div>
    </div>
  </div>

  <!-- Yönetici Bildirimleri Modalı -->
  <div class="modal-overlay" id="reportsModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Bildirilen İçerikler</h2>
        <button class="close-x" data-close="reportsModalOverlay">&times;</button>
      </div>
      <div id="reportsList"></div>
    </div>
  </div>

  <!-- Arşiv & Arama Modalı -->
  <div class="modal-overlay" id="archiveModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Arşiv ve Arama</h2>
        <button class="close-x" data-close="archiveModalOverlay">&times;</button>
      </div>
      <div class="form-group">
        <input type="text" id="archiveSearchInput" placeholder="Kelime, yazar, şarkı veya film ara...">
      </div>
      <div id="archiveList"></div>
    </div>
  </div>

  <!-- Popüler Satırlar Modalı -->
  <div class="modal-overlay" id="popModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>En Çok Beğenilenler</h2>
        <button class="close-x" data-close="popModalOverlay">&times;</button>
      </div>
      <div id="popList"></div>
    </div>
  </div>

  <!-- Görünüm Modalı -->
  <div class="modal-overlay" id="appearanceModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Görünüm Ayarları</h2>
        <button class="close-x" data-close="appearanceModalOverlay">&times;</button>
      </div>
      <div class="form-group">
        <label>Renk Teması</label>
        <div class="picker-grid">
          <button type="button" class="picker-chip" data-set-theme="light">Klasik Krem</button>
          <button type="button" class="picker-chip" data-set-theme="dark">Gece</button>
          <button type="button" class="picker-chip" data-set-theme="sepia">Eski Kâğıt</button>
          <button type="button" class="picker-chip" data-set-theme="sage">Adaçayı</button>
          <button type="button" class="picker-chip" data-set-theme="midnight">
