<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlham Kartı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f6f4f0;
      --card-bg: #ffffff;
      --text-main: #2b2927;
      --text-muted: #78736e;
      --accent: #8c5e58;
      --accent-hover: #734b46;
      --border-color: #e8e3dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(43, 41, 39, 0.05);
      text-align: center;
      transition: transform 0.2s ease;
    }

    .category {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      background-color: #f4ecea;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .quote-wrapper {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .fade-out {
      opacity: 0;
    }

    .quote-text {
      font-family: 'Lora', serif;
      font-size: 1.45rem;
      line-height: 1.65;
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .quote-author {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-style: italic;
      font-family: 'Lora', serif;
    }

    .actions {
      margin-top: 36px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #f9f7f4;
      color: var(--text-main);
    }

    footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }
      .quote-text {
        font-size: 1.25rem;
      }
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <span class="category" id="category">Kitap</span>
    
    <div class="quote-wrapper" id="quoteWrapper">
      <p class="quote-text" id="quoteText"></p>
      <p class="quote-author" id="quoteAuthor"></p>
    </div>

    <div class="actions">
      <button class="btn-primary" id="newQuoteBtn">Yeni Kart Çek</button>
      <button class="btn-secondary" id="copyBtn">Kopyala</button>
    </div>
  </main>

  <footer>Günün küçük bir duraklaması</footer>

  <script>
    // Kendi cümlelerini, sevdiğin kitap veya film alıntılarını buraya ekleyebilirsin
    const alintilar = [
      {
        metin: "İnsan, ne kadar uzağa giderse gitsin, kendi içindeki mevsimi yanında taşır.",
        kaynak: "Kendi Notum",
        kategori: "Not"
      },
      {
        metin: "Bazı yollar ancak yürümeye başladığında görünür olur.",
        kaynak: "Anonim",
        kategori: "İlham"
      },
      {
        metin: "İnsan ancak yüreğiyle baktığı zaman doğruyu görebilir. Gerçeğin mayası gözle görülmez.",
        kaynak: "Antoine de Saint-Exupéry, Küçük Prens",
        kategori: "Kitap"
      },
      {
        metin: "Her şeyin bir çatlağı vardır; ışık içeri oradan sızar.",
        kaynak: "Leonard Cohen",
        kategori: "Söz"
      },
      {
        metin: "Yavaş gitmekten korkma, sadece durmaktan kork.",
        kaynak: "Çin Atasözü",
        kategori: "İlham"
      },
      {
        metin: "Bir hikâyeyi güzel yapan, kusursuz olması değil; sahici olmasıdır.",
        kaynak: "Kendi Notum",
        kategori: "Not"
      }
    ];

    const quoteText = document.getElementById("quoteText");
    const quoteAuthor = document.getElementById("quoteAuthor");
    const categoryEl = document.getElementById("category");
    const quoteWrapper = document.getElementById("quoteWrapper");
    const newQuoteBtn = document.getElementById("newQuoteBtn");
    const copyBtn = document.getElementById("copyBtn");

    let sonIndeks = -1;

    function yeniAlintiGetir() {
      let rastgeleIndeks;
      do {
        rastgeleIndeks = Math.floor(Math.random() * alintilar.length);
      } while (rastgeleIndeks === sonIndeks && alintilar.length > 1);

      sonIndeks = rastgeleIndeks;
      const secilen = alintilar[rastgeleIndeks];

      quoteWrapper.classList.add("fade-out");

      setTimeout(() => {
        quoteText.textContent = `“${secilen.metin}”`;
        quoteAuthor.textContent = `— ${secilen.kaynak}`;
        categoryEl.textContent = secilen.kategori;
        quoteWrapper.classList.remove("fade-out");
      }, 250);
    }

    copyBtn.addEventListener("click", () => {
      const kopyalanacak = `${quoteText.textContent} ${quoteAuthor.textContent}`;
      navigator.clipboard.writeText(kopyalanacak).then(() => {
        const eskiYazi = copyBtn.textContent;
        copyBtn.textContent = "Kopyalandı!";
        setTimeout(() => {
          copyBtn.textContent = eskiYazi;
        }, 1500);
      });
    });

    newQuoteBtn.addEventListener("click", yeniAlintiGetir);

    // Sayfa ilk açıldığında bir kart göster
    yeniAlintiGetir();
  </script>
</body>
</html>
