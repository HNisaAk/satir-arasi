<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>S.A. Logo PNG İndirici</title>
  <style>
    body { font-family: sans-serif; background: #f6e7e4; color: #3b2826; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; margin: 0; }
    button { background: #a85d56; color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="c" width="512" height="512" style="width:220px;height:220px;border-radius:24px;box-shadow:0 10px 25px rgba(0,0,0,0.08);"></canvas>
  <button id="dlBtn">logo.png Olarak İndir</button>

  <script>
    const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      <rect width="512" height="512" fill="#f6e7e4"/>
      <path d="M 70 210 Q 86 242 120 252 Q 86 262 70 294 Q 60 262 26 252 Q 60 242 70 210 Z" fill="#3b2826"/>
      <path d="M 134 122 Q 142 142 162 150 Q 142 158 134 178 Q 126 158 106 150 Q 126 142 134 122 Z" fill="#3b2826"/>
      <text x="296" y="314" text-anchor="middle" fill="#3b2826" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="184" font-weight="600" letter-spacing="-2">S.A.</text>
    </svg>`;

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, 512, 512);
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);

    document.getElementById("dlBtn").addEventListener("click", () => {
      const a = document.createElement("a");
      a.download = "logo.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    });
  </script>
</body>
</html>
